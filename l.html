<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de acceso</title>
    <style>
        /* ========================= CONFIGURACIÓN GENERAL ========================= */
        * {
            box-sizing: border-box;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #666;
        }
        /* ========================= LOGO SVG ========================= */
        .logo_sidebar_img {
            background-image: url("../logo.svg");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: left center;
            height: 42px;
            max-width: 225px;
            width: 225px;
            margin-left: -3px;
            max-height: 55px;
        }
        /* ========================= VISTA PC ========================= */
        .desktop-layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* CABECERA */
        .header {
            height: 110px;
            padding: 30px 25px;
        }
        .subtitle {
            margin-top: 18px;
            font-size: 16px;
            letter-spacing: .5px;
        }
        /* CONTENIDO PRINCIPAL */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 80px;
            padding: 40px 40px 0;
        }
        /* FORMULARIO PC */
        .login-area {
            width: 390px;
            padding-top: 25px;
        }
        .login-title {
            font-size: 28px;
            font-weight: normal;
            text-align: center;
            margin-bottom: 50px;
            color: #666;
        }
        .input-group {
            margin-bottom: 28px;
        }
        .input-group input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #ddd;
            padding: 12px 7px;
            font-size: 19px;
            outline: none;
            color: #555;
        }
        .input-group input:focus {
            border-bottom: 2px solid #f47721;
        }
        /* CHECKBOX PC */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 16px;
            margin: 20px 0 30px;
        }
        .checkbox-row input {
            width: 20px;
            height: 20px;
        }
        /* BOTÓN PC - color salmon cuando se completa la clave de 4 dígitos */
        .login-btn {
            width: 100%;
            height: 46px;
            border: none;
            background: #e9e9e9;
            color: #777;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .login-btn.active {
            background: #fa8072; /* color salmon */
        }
        /* ENLACES PC */
        .link {
            display: block;
            text-align: center;
            color: #f47721;
            text-decoration: none;
            margin-top: 26px;
            font-size: 14px;
        }
        .first-time {
            text-align: center;
            margin-top: 55px;
            color: #222;
            font-size: 15px;
        }
        /* IMAGEN PC */
        .image-area {
            width: 600px;
            height: 600px;
            overflow: hidden;
        }
        .image-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* PIE DE PÁGINA */
        .footer {
            text-align: center;
            font-size: 13px;
            padding: 12px;
        }
        /* ========================= VISTA MÓVIL ========================= */
        .mobile-layout {
            display: none;
        }
        /* ========================= RESPONSIVE MÓVIL ========================= */
        @media (max-width: 768px) {
            /* OCULTAR PC */
            .desktop-layout {
                display: none;
            }
            /* CONTENEDOR MÓVIL */
            .mobile-layout {
                display: block;
                min-height: 100vh;
                padding: 28px 24px 30px;
            }
            /* LOGO MÓVIL */
            .logo_sidebar_img {
                width: 190px;
                height: 40px;
                max-width: 190px;
                margin-left: 0;
                margin-bottom: 38px;
            }
            /* FORMULARIO MÓVIL */
            .mobile-login {
                width: 100%;
            }
            /* INPUTS MÓVIL */
            .mobile-input {
                width: 100%;
                height: 44px;
                border: none;
                border-bottom: 1px solid #ddd;
                font-size: 18px;
                padding: 4px 6px;
                outline: none;
                color: #666;
                margin-bottom: 15px;
            }
            .mobile-input:focus {
                border-bottom: 2px solid #f47721;
            }
            /* CHECKBOX MÓVIL */
            .mobile-checkbox {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 14px;
                color: #777;
                margin: 15px 0;
            }
            .mobile-checkbox input {
                width: 18px;
                height: 18px;
            }
            /* BOTÓN MÓVIL - color salmon cuando se completa la clave de 4 dígitos */
            .mobile-button {
                width: 100%;
                height: 46px;
                border: none;
                background: #e9e9e9;
                border-radius: 5px;
                color: #ffff;
                font-size: 14px;
                margin-top: 7px;
                cursor: pointer;
                transition: background 0.3s ease;
            }
            .mobile-button.active {
                background: #eb5600; /* color salmon */
            }
            /* ENLACES MÓVIL */
            .mobile-link {
                display: block;
                text-align: center;
                color: #e87528;
                text-decoration: none;
                font-size: 15px;
                margin-top: 25px;
            }
            /* TEXTO INFERIOR */
            .mobile-first-time {
                text-align: center;
                font-size: 15px;
                color: #222;
                margin-top: 34px;
                line-height: 1.5;
            }
            .mobile-create {
                display: block;
                text-align: center;
                color: #e87528;
                text-decoration: none;
                font-size: 15px;
                margin-top: 12px;
            }
            /* ESPACIO MUY GRANDE ENTRE FORMULARIO E IMAGEN */
            .mobile-image {
                width: 100%;
                height: 280px;
                margin-top: 500px;
                overflow: hidden;
            }
            /* IMAGEN MÓVIL */
            .mobile-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }
        /* ========================= MÓVILES PEQUEÑOS ========================= */
        @media (max-width: 400px) {
            .mobile-layout {
                padding: 24px 20px;
            }
            .logo_sidebar_img {
                width: 175px;
                height: 36px;
                max-width: 175px;
                margin-bottom: 34px;
            }
            .mobile-input {
                font-size: 17px;
                height: 42px;
            }
            .mobile-checkbox {
                font-size: 13px;
            }
            .mobile-button {
                height: 44px;
                font-size: 13px;
            }
            .mobile-link {
                font-size: 14px;
            }
            .mobile-first-time {
                font-size: 14px;
            }
            .mobile-create {
                font-size: 14px;
            }
            /* ESPACIO MUY GRANDE EN MÓVIL PEQUEÑO */
            .mobile-image {
                height: 230px;
                margin-top: 500px;
            }
        }
    </style>
</head>
<body>
    <!-- ================================================= VISTA PC ================================================= -->
    <div class="desktop-layout">
        <!-- CABECERA -->
        <header class="header">
            <!-- LOGO SVG -->
            <div class="logo_sidebar_img"></div>
            <div class="subtitle">
                Banca Online
            </div>
        </header>
        <!-- CONTENIDO PRINCIPAL -->
        <main class="main">
            <!-- FORMULARIO -->
            <section class="login-area">
                <h1 class="login-title">
                    Iniciar sesión
                </h1>
                <div class="input-group">
                    <input type="text" placeholder="Tu DNI">
                </div>
                <div class="input-group">
                    <input type="text" placeholder="Tu usuario Galicia">
                </div>
                <div class="input-group">
                    <input type="password" id="clavePc" placeholder="Tu clave Galicia" maxlength="4" inputmode="numeric" pattern="[0-9]*">
                </div>
                <label class="checkbox-row">
                    <input type="checkbox">
                    Recordar identificación y usuario
                </label>
                <button class="login-btn" id="botonPc" type="button">
                    INICIAR SESIÓN
                </button>
                <a href="#" class="link">
                    OLVIDÉ O BLOQUEÉ MIS CLAVES
                </a>
                <div class="first-time">
                    Si es tu primera vez o necesitás el usuario
                </div>
                <a href="#" class="link">
                    CREÁ TUS CLAVES
                </a>
            </section>
            <!-- IMAGEN PC -->
            <section class="image-area">
                <img src="https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=900&q=80" alt="Imagen decorativa">
            </section>
             
        </main>
        <!-- FOOTER -->
        <footer class="footer">
            Operar con Banca Online implica aceptar los términos y condiciones del servicio.
        </footer>
    </div>

    <!-- ================================================= VISTA MÓVIL ================================================= -->
    <div class="mobile-layout">
        <!-- LOGO SVG -->
        <div class="logo_sidebar_img"></div>
        <!-- FORMULARIO -->
        <main class="mobile-login">
            <input class="mobile-input" type="text" placeholder="Tu DNI">
            <input class="mobile-input" type="text" placeholder="Tu usuario Galicia">
            <input class="mobile-input" type="password" id="claveMovil" placeholder="Tu clave Galicia" maxlength="4" inputmode="numeric" pattern="[0-9]*">
            <!-- CHECKBOX -->
            <label class="mobile-checkbox">
                <input type="checkbox">
                Recordar identificación y usuario
            </label>
            <!-- BOTÓN -->
            <button class="mobile-button" id="botonMovil" type="button">
                INICIAR SESIÓN
            </button>
            <!-- ENLACE -->
            <a href="#" class="mobile-link">
                OLVIDÉ O BLOQUEÉ MIS CLAVES
            </a>
            <!-- TEXTO -->
            <div class="mobile-first-time">
                Si es tu primera vez o necesitás el usuario
            </div>
            <!-- CREAR CLAVES -->
            <a href="#" class="mobile-create">
                CREÁ TUS CLAVES
            </a>
        </main>
        <!-- ESPACIO GRANDE ANTES DE LA IMAGEN -->
        <div class="mobile-image">
            <img src="https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=900&q=80" alt="Imagen decorativa">
        </div>

     
         <div class="mobile-image">
            <img src="https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=900&q=80" alt="Imagen decorativa">
        </div>
    </div>

    <script>
        // Función para controlar el cambio de color del botón según la clave
        function controlarBoton(claveInput, boton) {
            claveInput.addEventListener('input', function() {
                // Si el campo tiene 4 dígitos numéricos, activa el color salmon
                if (this.value.length === 4 && /^[0-9]{4}$/.test(this.value)) {
                    boton.classList.add('active');
                } else {
                    boton.classList.remove('active');
                }
            });
        }

        // Obtener elementos
        var clavePc = document.getElementById('clavePc');
        var botonPc = document.getElementById('botonPc');
        var claveMovil = document.getElementById('claveMovil');
        var botonMovil = document.getElementById('botonMovil');

        // Controlar ambos campos (PC y móvil)
        controlarBoton(clavePc, botonPc);
        controlarBoton(claveMovil, botonMovil);
    </script>
</body>
</html>
